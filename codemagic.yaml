workflows:
  ios_unsigned:
    name: Flutter iOS Release未签名包
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: 预热 iOS 工具链
        script: flutter precache --ios
      - name: flutter pub get
        script: flutter pub get
      - name: 关闭 SPM 并重装 CocoaPods
        script: |
          flutter config --no-enable-swift-package-manager
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..
      - name: Build iOS Release 不签名
        script: flutter build ios --release --no-codesign
      - name: 打包生成未签名 ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr Runner.ipa Payload
    artifacts:
      - build/ios/iphoneos/Runner.ipa